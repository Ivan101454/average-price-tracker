services:
  postgres:
    image: postgres:16-alpine
    container_name: average-price-tracker-postgres
    environment:
      POSTGRES_DB: average_price
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d average_price" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: average-price-tracker-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/average_price
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_FLYWAY_ENABLED=true
      # Setting the Binance polling interval via the Environment variable
      - BINANCE_POLL_INTERVAL=PT30S
      # URL for Feign client
      - BINANCE_API_URL=https://api.binance.com
    depends_on:
      postgres:
        condition: service_healthy # healthcheck
    restart: unless-stopped
volumes:
  postgres-data:
